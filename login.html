<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bird Box · Dashboard access</title><style>body{margin:0;background:#f3f5f1;color:#17372f;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{background:white;padding:42px;border:1px solid #d8e2db;border-radius:20px;max-width:380px;margin:20px}label{display:block;margin:28px 0 10px}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #b5c7bc;border-radius:8px}button{width:100%;padding:14px;background:#173f35;color:white;border:0;border-radius:8px;margin-top:14px;cursor:pointer}p{line-height:1.6;color:#53685d}#error{color:#ab332b}</style><main><small>BIRD BOX / SUPPORT OPERATIONS</small><h1>Your support story,<br>in one place.</h1><p>Enter the dashboard access key to view call performance and customer issues.</p><form id="form"><label for="key">Dashboard access key</label><input id="key" type="password" autocomplete="off" required><button>Open dashboard</button><p id="error" role="alert"></p></form></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const key=document.getElementById('key');try{const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:key.value})});key.value='';if(r.ok){const data=await r.json();location.href=data.redirect_url==='/voice'?'/voice':'/'}else document.getElementById('error').textContent='The access key was not accepted.'}catch{document.getElementById('error').textContent='Connection failed. Please retry.'}};</script></html>
